name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image and run project checks
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}-${{ matrix.arch }}" .
      - name: Verify container startup and HTTP endpoints
        run: |
          docker run --detach --name lightsail-panel-test --hostname lightsail-panel \
            --publish 127.0.0.1:8090:8090 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            --retry-connrefused http://127.0.0.1:8090/api/health > health.json
          python3 -c 'import json; assert json.load(open("health.json"))["ok"] is True'
          curl --fail --silent http://127.0.0.1:8090/api/auth > auth.json
          python3 -c 'import json; d=json.load(open("auth.json")); assert d["initialized"] is False and d["authenticated"] is False'
          curl --fail --silent http://127.0.0.1:8090/lightsail | grep -q 'id="root"'
          test "$(docker inspect --format '{{.Config.User}}' lightsail-panel-test)" = node
          test "$(docker exec lightsail-panel-test printenv PORT)" = 8090
          test "$(docker inspect --format '{{json .Config.ExposedPorts}}' lightsail-panel-test)" = '{"8090/tcp":{}}'
          test "$(docker inspect --format '{{json .Config.Cmd}}' lightsail-panel-test)" = '["lightsail-panel"]'
          test "$(docker inspect --format '{{.Path}}' lightsail-panel-test)" = lightsail-panel
          test "$(docker exec lightsail-panel-test hostname)" = lightsail-panel
          docker exec lightsail-panel-test lightsail-panel --healthcheck
          docker exec lightsail-panel-test ssh -V
          docker exec lightsail-panel-test node --input-type=module -e '
            import { spawn } from "node-pty";
            const terminal = spawn("ssh", ["-V"], { name: "xterm-256color", cols: 80, rows: 24 });
            let output = "";
            terminal.onData(data => { output += data; });
            terminal.onExit(({ exitCode }) => {
              if (exitCode || !output.includes("OpenSSH")) process.exit(1);
              console.log("OpenSSH PTY verified");
            });
          '
          docker exec lightsail-panel-test sh -ec '
            test "$(cat /proc/1/comm)" = lightsail-panel
            test "$(tr "\000" "\n" < /proc/1/cmdline | head -n 1)" = lightsail-panel
            # The first HTTP/static-file request can create libuv workers after startup.
            for attempt in $(seq 1 35); do
              names=$(cat /proc/1/task/*/comm | sort -u)
              if [ "$names" = lightsail-panel ]; then exit 0; fi
              sleep 1
            done
            printf "%s\n" "$names"
            exit 1
          '
          test "$(docker inspect --format '{{.Architecture}}' "${IMAGE_NAME}:sha-${GITHUB_SHA}-${{ matrix.arch }}")" = "${{ matrix.arch }}"
          docker stop --time 10 lightsail-panel-test
          test "$(docker inspect --format '{{.State.ExitCode}}' lightsail-panel-test)" = 0
      - name: Publish tested platform image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
      - name: Container logs
        if: always()
        run: docker logs lightsail-panel-test || true
      - name: Stop test container
        if: always()
        run: docker rm --force lightsail-panel-test || true

  publish:
    name: Publish multi-platform image
    needs: docker
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish image tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=("sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=(latest)
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}")
          fi
          for tag in "${tags[@]}"; do
            docker manifest create "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
              "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"
            docker manifest push "${IMAGE_NAME}:${tag}"
          done
          docker manifest inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" > manifest.json
          python3 -c 'import json; platforms={m["platform"]["architecture"] for m in json.load(open("manifest.json"))["manifests"]}; assert platforms == {"amd64", "arm64"}'
      - name: Verify deployment from the registry
        env:
          PANEL_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          PANEL_PORT: 8090
        run: |
          docker compose config --format json > compose.json
          python3 -c 'import json; d=json.load(open("compose.json")); s=d["services"]["lightsail-panel"]; assert list(d["services"]) == ["lightsail-panel"]; assert s["container_name"] == "lightsail-panel"; assert s["environment"]["PORT"] == "8090"; assert s["ports"][0]["target"] == 8090; assert s["ports"][0]["published"] == "8090"; assert d["volumes"]["lightsail-panel-data"]["name"] == "lightsail-panel-data"'
          docker compose pull
          docker compose up -d
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            --retry-connrefused http://127.0.0.1:8090/api/health > health.json
          python3 -c 'import json; assert json.load(open("health.json"))["ok"] is True'
          test "$(docker inspect --format '{{.Name}}' lightsail-panel)" = /lightsail-panel
          test "$(docker inspect --format '{{.Path}}' lightsail-panel)" = lightsail-panel
          test "$(docker exec lightsail-panel hostname)" = lightsail-panel
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Name}}{{end}}{{end}}' lightsail-panel)" = lightsail-panel-data
          docker exec lightsail-panel lightsail-panel --healthcheck
      - name: Verify custom host port
        env:
          PANEL_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          PANEL_PORT: 18090
        run: |
          docker compose up -d
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            --retry-connrefused http://127.0.0.1:18090/api/health > health.json
          python3 -c 'import json; assert json.load(open("health.json"))["ok"] is True'
          test "$(docker exec lightsail-panel printenv PORT)" = 8090
          docker exec lightsail-panel lightsail-panel --healthcheck
      - name: Deployment logs
        if: always()
        run: docker compose logs || true
      - name: Stop deployment
        if: always()
        run: docker compose down --volumes || true
